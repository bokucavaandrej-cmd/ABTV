<!DOCTYPE html>
<html>

<head>

<title>ABTV</title>

<style>

body {
    margin:0;
    background:black;
    overflow:hidden;
    font-family:Arial;
}


.logo {

    position:fixed;
    top:20px;
    right:30px;

    color:#00aaff;
    font-size:45px;

    z-index:10;

}


.screen {

    width:100vw;
    height:100vh;

}


iframe {

    width:100%;
    height:100%;

    border:0;

}



.info {

    position:fixed;
    bottom:20px;
    left:30px;

    color:white;
    font-size:25px;

}



</style>

</head>


<body>


<div class="logo">
📺 ABTV
</div>


<div class="screen">

<iframe 
id="player"
allow="autoplay; fullscreen">
</iframe>

</div>


<div class="info">
Сейчас играет: Барбоскины
</div>



<script type="module">


import { initializeApp } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import { getDatabase, ref, onValue }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";



const firebaseConfig = {

apiKey: "AIzaSyAkuGbdhB5VLy4BEOVtqoXpzZI29eQqOjc",

authDomain: "abtv-c051d.firebaseapp.com",

databaseURL: "https://abtv-c051d-default-rtdb.europe-west1.firebasedatabase.app",

projectId: "abtv-c051d",

storageBucket: "abtv-c051d.firebasestorage.app",

messagingSenderId: "351357236534",

appId: "1:351357236534:web:77289c6ecaf932c6a26f97"

};



const app = initializeApp(firebaseConfig);


const db = getDatabase(app);


const player = document.getElementById("player");



const youtubeVideo = 
"https://www.youtube.com/embed/k4zTxaUwK9I?autoplay=1&controls=0&rel=0";



onValue(ref(db,"tv"),(snapshot)=>{


const data = snapshot.val();



if(data && data.command === "barboskiny"){


player.src = youtubeVideo;


}


});



</script>


</body>

</html>
