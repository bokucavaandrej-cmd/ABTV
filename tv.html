<!DOCTYPE html>
<html>
<head>
<title>ABTV TV</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: black;
    color: white;
    font-family: Arial;
    overflow: hidden;
}


/* Логотип */

.logo {
    position: fixed;
    top: 25px;
    right: 30px;

    font-size: 50px;
    font-weight: bold;

    color: white;

    background: rgba(0,0,0,0.4);
    padding: 10px 20px;

    border-radius: 15px;

    z-index: 2;
}


/* Видео */

.screen {
    width: 100%;
    height: 100vh;
}


video {
    width: 100%;
    height: 100%;

    object-fit: cover;
}


/* Информация */

.info {
    position: fixed;

    bottom: 25px;
    left: 30px;

    font-size: 28px;

    background: rgba(0,0,0,0.5);

    padding: 10px 20px;

    border-radius: 10px;
}

</style>

</head>


<body>


<div class="logo">
📺 ABTV
</div>


<div class="screen">

<video autoplay muted loop playsinline>

    <source src="video/barboskiny.mp4" type="video/mp4">

</video>

</div>


<div class="info">
Сейчас играет: Барбоскины
</div>


</body>
</html>
