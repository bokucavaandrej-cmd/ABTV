<!DOCTYPE html>
<html>

<head>

<title>ABTV</title>

<style>

body{
    margin:0;
    background:#000;
    overflow:hidden;
    font-family:Arial, sans-serif;
}


/* логотип как Netflix стиль */

.logo{

    position:fixed;
    top:25px;
    left:35px;

    color:#e50914;
    font-size:50px;
    font-weight:bold;

    text-shadow:0 0 20px red;

    z-index:10;

}



/* экран */

.screen{

    width:100vw;
    height:100vh;

}



/* видео */

iframe{

    width:100%;
    height:100%;

    border:0;

    pointer-events:none;

}



/* нижняя панель */

.info{

    position:fixed;

    bottom:30px;
    left:40px;

    color:white;

    font-size:25px;

    background:rgba(0,0,0,0.6);

    padding:15px 25px;

    border-left:5px solid #e50914;

    border-radius:10px;

}



/* LIVE */

.live{

    position:fixed;

    top:35px;
    right:40px;

    color:white;

    background:#e50914;

    padding:10px 20px;

    border-radius:20px;

    font-weight:bold;

}



</style>

</head>


<body>



<div class="logo">
ABTV
</div>


<div class="live">
🔴 LIVE
</div>



<div class="screen">

<iframe 
id="player"
allow="autoplay; fullscreen">
</iframe>

</div>



<div class="info">

Сейчас:
Барбоскины

</div>



<script type="module">


import { initializeApp } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import { getDatabase, ref, onValue } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";



const firebaseConfig = {

apiKey:"AIzaSyAkuGbdhB5VLy4BEOVtqoXpzZI29eQqOjc",

authDomain:"abtv-c051d.firebaseapp.com",

databaseURL:"https://abtv-c051d-default-rtdb.europe-west1.firebasedatabase.app",

projectId:"abtv-c051d",

storageBucket:"abtv-c051d.firebasestorage.app",

messagingSenderId:"351357236534",

appId:"1:351357236534:web:77289c6ecaf932c6a26f97"

};



const app = initializeApp(firebaseConfig);


const db = getDatabase(app);



const player = document.getElementById("player");



const channels = {

barboskiny:
"https://www.youtube.com/embed/k4zTxaUwK9I?autoplay=1&controls=0&rel=0"

};



onValue(ref(db,"tv"),(snapshot)=>{


const data=snapshot.val();



if(data && channels[data.command]){


player.src=channels[data.command];


}


});




// блокируем управление

document.addEventListener("keydown",(e)=>{

e.preventDefault();

});


</script>



</body>

</html>
