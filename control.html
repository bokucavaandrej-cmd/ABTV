}

}

button {
    background:#00aaff;
    color:white;
    font-size:30px;
    padding:20px 40px;
    margin:20px;
    border:0;
    border-radius:20px;

<body>

<h1>🎮 ABTV Пульт</h1>


<button onclick="sendCommand('barboskiny')">

</button>



<script type="module">


import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import { getDatabase, ref, set }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";



const firebaseConfig = {

apiKey: "AIzaSyAkuGbdhB5VLy4BEOVtqoXpzZI29eQqOjc",

databaseURL: "https://abtv-c051d-default-rtdb.europe-west1.firebasedatabase.app",

messagingSenderId: "351357236534",

appId: "1:351357236534:web:77289c6ecaf932c6a26f97"

};



const app = initializeApp(firebaseConfig);


const db = getDatabase(app);



window.sendCommand = function(video){

});

}


</script>
